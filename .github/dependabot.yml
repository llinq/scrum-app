version: 2
updates:
  # Dependências do projeto raiz
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "root"
    groups:
      root:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dependências da API (NestJS)
  - package-ecosystem: "npm"
    directory: "/scrum-app-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "api"
    ignore:
      # Ignorar updates de major versions para dependências críticas
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typeorm"
        update-types: ["version-update:semver-major"]
    groups:
      api:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dependências do Web (Next.js)
  - package-ecosystem: "npm"
    directory: "/scrum-app-web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "web"
    ignore:
      # Ignorar updates de major versions para dependências críticas
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
