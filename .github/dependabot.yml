version: 2
updates:
  # Dependências do projeto raiz
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "llinq"
    labels:
      - "dependencies"
      - "root"

  # Dependências da API (NestJS)
  - package-ecosystem: "npm"
    directory: "/scrum-app-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "llinq"
    labels:
      - "dependencies"
      - "api"
      - "nestjs"
    ignore:
      # Ignorar updates de major versions para dependências críticas
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typeorm"
        update-types: ["version-update:semver-major"]
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      testing:
        patterns:
          - "jest"
          - "@types/jest"
          - "supertest"
          - "@types/supertest"

  # Dependências do Web (Next.js)
  - package-ecosystem: "npm"
    directory: "/scrum-app-web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "llinq"
    labels:
      - "dependencies"
      - "web"
      - "nextjs"
    ignore:
      # Ignorar updates de major versions para dependências críticas
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      nextjs:
        patterns:
          - "next"
          - "next-*"
      ui-components:
        patterns:
          - "lucide-react"
          - "@dnd-kit/*"
          - "clsx"
      dev-tools:
        patterns:
          - "eslint"
          - "eslint-*"
          - "tailwindcss"
          - "typescript"
