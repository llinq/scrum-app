name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy API and Web
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: scrum-app-467401
      REGION: us-east1
      API_SERVICE: scrum-app-api
      WEB_SERVICE: scrum-app-web
      REGISTRY_HOST: gcr.io
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - name: Build API image
        run: |
          docker build \
            -f scrum-app-api/Dockerfile \
            -t ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/scrum-app-api:${{ env.IMAGE_TAG }} \
            .

      - name: Push API image
        run: docker push ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/scrum-app-api:${{ env.IMAGE_TAG }}

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy ${{ env.API_SERVICE }} \
            --image ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/scrum-app-api:${{ env.IMAGE_TAG }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --quiet

      - name: Build Web image
        run: |
          docker build \
            -f scrum-app-web/Dockerfile \
            -t ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/scrum-app-web:${{ env.IMAGE_TAG }} \
            .

      - name: Push Web image
        run: docker push ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/scrum-app-web:${{ env.IMAGE_TAG }}

      - name: Deploy Web to Cloud Run
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE }} \
            --image ${{ env.REGISTRY_HOST }}/${{ env.PROJECT_ID }}/scrum-app-web:${{ env.IMAGE_TAG }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --platform managed \
            --quiet
