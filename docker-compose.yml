version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scrum-app
      POSTGRES_USER: scrum_user
      POSTGRES_PASSWORD: scrum_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: llinq@scrumapp.com
      PGADMIN_DEFAULT_PASSWORD: 123@Mudar
    ports:
      - "5050:80"

volumes:
  pgdata:
